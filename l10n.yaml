# Flutter gen-l10n configuration.
# English (app_en.arb) is the source/template language.
# To add a language: copy app_en.arb to app_<code>.arb, translate the values,
# then register it in lib/localization/supported_languages.dart.
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
nullable-getter: false
untranslated-messages-file: build/untranslated_messages.json
